<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш вечер 💕</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            /* Твой фон */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://sun9-77.vkuserphoto.ru/s/v1/ig2/PaEN9WzLrsDIZ3B3U7vu4oIEZU5cTTZUPoxfqiZVUN71H44_6Rbar6l6LP37BD3YR5i59ofjnLduPKz03nNYgMnZ.jpg?quality=95&as=32x57,48x85,72x128,108x192,160x284,240x427,360x640,480x853,540x960,640x1138,720x1280,1080x1920&from=bu&u=-L2g89e4tqKHpfnizaKh_7gEyOqMxTcbURyr5NMnMo8&cs=1080x0');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            /* Сделал фон контейнера чуть темнее, чтобы текст читался поверх фото */
            background: rgba(20, 20, 30, 0.7); 
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .subtitle { text-align: center; color: #ddd; margin-bottom: 30px; font-size: 0.95rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .step { display: none; animation: fadeIn 0.4s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        
        .options { display: flex; flex-direction: column; gap: 15px; }
        
        /* Стили для карточек с картинками */
        .option-card {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            overflow: hidden;
            text-align: left;
            align-items: stretch;
            width: 100%;
            padding: 0;
        }
        .option-card:hover {
            background: rgba(255,255,255,0.2);
            border-color: #e94560;
            transform: translateY(-2px);
        }
        .option-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-desc {
            font-size: 0.85rem;
            color: #ddd;
            line-height: 1.3;
        }

        .final-msg { text-align: center; font-size: 1.2rem; line-height: 1.6; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .heart { font-size: 3rem; display: block; margin-bottom: 20px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет, солнышко 💖</h1>
        <p class="subtitle">Давай спланируем наш идеальный вечер</p>

        <!-- Шаг 1: Фильм -->
        <div class="step active" id="step1">
            <h2>🎬 Что посмотрим?</h2>
            <div class="options">
                
                <button class="option-card" onclick="choose('film', 'Интерстеллар')">
                    <img src="https://avatars.mds.yandex.net/get-kinopoisk-image/1600647/9cf38fb7-6482-41db-8251-6e00f3237c4b/300x450" alt="Постер">
                    <div class="card-content">
                        <div class="card-title">🌌 Интерстеллар</div>
                        <div class="card-desc">Фантастика, которая заставит задуматься о времени и космосе.</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Джентльмены')">
                    <img src="https://avatars.mds.yandex.net/get-kinopoisk-image/1599028/69036a2e-fd41-44e7-bd1e-d1a7b2b8a2d2/300x450" alt="Постер">
                    <div class="card-content">
                        <div class="card-title">🕶️ Джентльмены</div>
                        <div class="card-desc">Стильный боевик Гая Ричи с крутыми диалогами.</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Комедия')">
                    <img src="https://avatars.mds.yandex.net/get-kinopoisk-image/4483445/4d121a8a-bd35-4318-bd77-85ec24e3087f/300x450" alt="Постер">
                    <div class="card-content">
                        <div class="card-title">😂 Что-то лёгкое</div>
                        <div class="card-desc">Просто хорошая комедия, чтобы посмеяться и отдохнуть.</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Шаг 2: Закуски -->
        <div class="step" id="step2">
            <h2>🍿 Чем похрустим?</h2>
            <div class="options">
                
                <button class="option-card" onclick="choose('snack', 'Попкорн')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Popcorn02.jpg/330px-Popcorn02.jpg" alt="Попкорн">
                    <div class="card-content">
                        <div class="card-title">🍿 Попкорн</div>
                        <div class="card-desc">Классика для кино. Сладкий или соленый?</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('snack', 'Пицца')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Eq_it-na_pizza-margherita_sep2005_sml.jpg/330px-Eq_it-na_pizza-margherita_sep2005_sml.jpg" alt="Пицца">
                    <div class="card-content">
                        <div class="card-title">🍕 Пицца</div>
                        <div class="card-desc">Горячая, с тянущимся сыром. Идеально.</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('snack', 'Фрукты и шоколад')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Strawberries_and_chocolate.jpg/330px-Strawberries_and_chocolate.jpg" alt="Фрукты и шоколад">
                    <div class="card-content">
                        <div class="card-title">🍫 Фрукты и шоколад</div>
                        <div class="card-desc">Сладкая альтернатива, если хочется чего-то полегче.</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Шаг 3: Напитки -->
        <div class="step" id="step3">
            <h2>🥤 Что попьём?</h2>
            <div class="options">
                
                <button class="option-card" onclick="choose('drink', 'Красное вино')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Red_Wine_Glass.jpg/330px-Red_Wine_Glass.jpg" alt="Вино">
                    <div class="card-content">
                        <div class="card-title">🍷 Красное вино</div>
                        <div class="card-desc">Для романтического настроения.</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Пиво')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Beer_glass.jpg/330px-Beer_glass.jpg" alt="Пиво">
                    <div class="card-content">
                        <div class="card-title">🍺 Пиво</div>
                        <div class="card-desc">Под чипсы и пиццу залетает отлично.</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Кола/Лимонад')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Glass_of_Coca-Cola_with_Ice.jpg/330px-Glass_of_Coca-Cola_with_Ice.jpg" alt="Кола">
                    <div class="card-content">
                        <div class="card-title">🥤 Кола/Лимонад</div>
                        <div class="card-desc">Классика жанра, холодная и со льдом.</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Финал -->
        <div class="step" id="step4">
            <div class="final-msg">
                <span class="heart">💖</span>
                <p>Спасибо, любимая!</p>
                <p style="color:#aaa; font-size:0.9rem; margin-top:15px;">Я уже побежал готовить всё для нашего вечера. Скоро увидишь результат 😉</p>
            </div>
        </div>
    </div>

    <script>
        const answers = {};
        let currentStep = 1;

        function choose(category, value) {
            answers[category] = value;
            document.getElementById('step' + currentStep).classList.remove('active');
            currentStep++;
            document.getElementById('step' + currentStep).classList.add('active');

            if (currentStep === 4) {
                sendData();
            }
        }

        function sendData() {
            const formspreeUrl = 'https://formspree.io/f/xaeowdvp'; 
            const text = `🎬 Фильм: ${answers.film}\n🍿 Закуски: ${answers.snack}\n🥤 Напитки: ${answers.drink}`;

            fetch(formspreeUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ "Выбор для вечера": text })
            })
            .then(response => console.log(response.ok ? 'Успешно отправлено!' : 'Ошибка'))
            .catch(error => console.log('Ошибка:', error));
        }
    </script>
</body>
</html>
