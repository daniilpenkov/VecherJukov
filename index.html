<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш вечер 💕</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #111; 
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        .bg-blur {
            position: fixed;
            top: -20px; left: -20px; right: -20px; bottom: -20px; 
            background-image: url('https://sun9-77.vkuserphoto.ru/s/v1/ig2/PaEN9WzLrsDIZ3B3U7vu4oIEZU5cTTZUPoxfqiZVUN71H44_6Rbar6l6LP37BD3YR5i59ofjnLduPKz03nNYgMnZ.jpg?quality=95&as=32x57,48x85,72x128,108x192,160x284,240x427,360x640,480x853,540x960,640x1138,720x1280,1080x1920&from=bu&u=-L2g89e4tqKHpfnizaKh_7gEyOqMxTcbURyr5NMnMo8&cs=1080x0');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.4); 
            z-index: -1;
        }

        .bg-clear {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://sun9-77.vkuserphoto.ru/s/v1/ig2/PaEN9WzLrsDIZ3B3U7vu4oIEZU5cTTZUPoxfqiZVUN71H44_6Rbar6l6LP37BD3YR5i59ofjnLduPKz03nNYgMnZ.jpg?quality=95&as=32x57,48x85,72x128,108x192,160x284,240x427,360x640,480x853,540x960,640x1138,720x1280,1080x1920&from=bu&u=-L2g89e4tqKHpfnizaKh_7gEyOqMxTcbURyr5NMnMo8&cs=1080x0');
            background-size: contain; 
            background-position: center; 
            background-repeat: no-repeat;
            z-index: -1;
        }

        .container {
            max-width: 850px; 
            width: 100%;
            background: rgba(15, 15, 20, 0.85); 
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
        }
        
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .subtitle { text-align: center; color: #ddd; margin-bottom: 30px; font-size: 0.95rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .step { display: none; animation: fadeIn 0.4s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { font-size: 1.4rem; margin-bottom: 20px; text-align: center; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        
        .options { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 15px; 
        }
        
        .option-card {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column; 
            overflow: hidden;
            text-align: left;
            width: 100%;
            padding: 0;
        }
        .option-card:hover {
            background: rgba(255,255,255,0.2);
            border-color: #e94560;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .option-card img {
            width: 100%;
            height: 160px; 
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: #333; 
        }
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.4;
        }

        .final-msg { text-align: center; font-size: 1.2rem; line-height: 1.6; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .heart { font-size: 3rem; display: block; margin-bottom: 20px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div class="bg-blur"></div>
    <div class="bg-clear"></div>

    <div class="container">
        <h1>Привет, солнышко 💖</h1>
        <p class="subtitle">Давай спланируем вечер двух влюбленных друг в друга жуков 🐞💞🐞</p>

        <!-- Шаг 1: Фильм -->
        <div class="step active" id="step1">
            <h2>🎬 Что посмотрим?</h2>
            <div class="options">
                
                <button class="option-card" onclick="choose('film', 'Афера доктора Нока')">
                    <img src="https://static.okko.tv/images/v4/7fdc6bc9-92d0-4d78-82d4-5a04e9ba1f82" alt="Афера доктора Нока">
                    <div class="card-content">
                        <div class="card-title">🩺 Афера доктора Нока</div>
                        <div class="card-desc">Мошенник притворяется врачом и обманывает горожан. Трагикомедия</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Колония')">
                    <img src="https://i.playground.ru/e/eBS9PsZ_wXqr9sQX96cO5A.jpeg" alt="Колония">
                    <div class="card-content">
                        <div class="card-title">🧟 Колония</div>
                        <div class="card-desc">Вирус, зомби, выживание. Триллер</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Вечность')">
                    <img src="https://static.okko.tv/images/v4/10771bd4-0736-4e73-a7eb-bab6631692f2" alt="Вечность">
                    <div class="card-content">
                        <div class="card-title">💔 Вечность</div>
                        <div class="card-desc">Женщина, которая после смерти выбирает между любовью юности и годами, прожитыми с мужем. Мелодрама, комедия</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Выход 8')">
                    <img src="https://skillbox.ru/upload/setka_images/14013125082025_99ebd9c11408b0b6bb4e5268c43ec31c81eee3a2.jpg" alt="Выход 8">
                    <div class="card-content">
                        <div class="card-title">🚇 Выход 8</div>
                        <div class="card-desc">Поиск аномалий в бесконечном коридоре метро с целью выбраться. Ужасы, драма</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Злое')">
                    <img src="https://static.okko.tv/images/v4/7a0847c7-fe02-443f-ab8f-a983ed45ae1f?presetId=4000&width=1200&height=630&scale=1&quality=80" alt="Злое">
                    <div class="card-content">
                        <div class="card-title">👁️ Злое</div>
                        <div class="card-desc">Жертва насилия видит в кошмарах убийства и пытается их предотвратить. Ужасы, детектив</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Шаг 2: Закуски -->
        <div class="step" id="step2">
            <h2>🍿 Чем похрустим?</h2>
            <div class="options">
                
                <button class="option-card" onclick="choose('snack', 'Попкорн')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Popcorn02.jpg/640px-Popcorn02.jpg" alt="Попкорн">
                    <div class="card-content">
                        <div class="card-title">🍿 Попкорн</div>
                        <div class="card-desc">Классика для кино. Сладкий или соленый?</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('snack', 'Пицца')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Eq_it-na_pizza-margherita_sep2005_sml.jpg/640px-Eq_it-na_pizza-margherita_sep2005_sml.jpg" alt="Пицца">
                    <div class="card-content">
                        <div class="card-title">🍕 Пицца</div>
                        <div class="card-desc">Горячая, с тянущимся сыром. Идеально.</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('snack', 'Фрукты и шоколад')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Strawberries_and_chocolate.jpg/640px-Strawberries_and_chocolate.jpg" alt="Фрукты и шоколад">
                    <div class="card-content">
                        <div class="card-title">🍫 Фрукты и шоколад</div>
                        <div class="card-desc">Сладкая альтернатива, если хочется чего-то полегче.</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Шаг 3: Напитки -->
        <div class="step" id="step3">
            <h2>🥤 Что попьём?</h2>
            <div class="options">
                
                <button class="option-card" onclick="choose('drink', 'Красное вино')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Red_Wine_Glass.jpg/640px-Red_Wine_Glass.jpg" alt="Вино">
                    <div class="card-content">
                        <div class="card-title">🍷 Красное вино</div>
                        <div class="card-desc">Для романтического настроения.</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Пиво')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Beer_glass.jpg/640px-Beer_glass.jpg" alt="Пиво">
                    <div class="card-content">
                        <div class="card-title">🍺 Пиво</div>
                        <div class="card-desc">Под чипсы и пиццу залетает отлично.</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Кола/Лимонад')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Glass_of_Coca-Cola_with_Ice.jpg/640px-Glass_of_Coca-Cola_with_Ice.jpg" alt="Кола">
                    <div class="card-content">
                        <div class="card-title">🥤 Кола/Лимонад</div>
                        <div class="card-desc">Классика жанра, холодная и со льдом.</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Финал -->
        <div class="step" id="step4">
            <div class="final-msg">
                <span class="heart">💖</span>
                <p>Спасибо, любимая!</p>
                <p style="color:#aaa; font-size:0.9rem; margin-top:15px;">Я уже побежал готовить всё для нашего вечера. Скоро увидишь результат 😉</p>
            </div>
        </div>
    </div>

    <script>
        const answers = {};
        let currentStep = 1;

        function choose(category, value) {
            answers[category] = value;
            document.getElementById('step' + currentStep).classList.remove('active');
            currentStep++;
            document.getElementById('step' + currentStep).classList.add('active');

            if (currentStep === 4) {
                sendData();
            }
        }

        function sendData() {
            const formspreeUrl = 'https://formspree.io/f/xaeowdvp'; 
            const text = `🎬 Фильм: ${answers.film}\n🍿 Закуски: ${answers.snack}\n🥤 Напитки: ${answers.drink}`;

            fetch(formspreeUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ "Выбор для вечера": text })
            })
            .then(response => console.log(response.ok ? 'Успешно отправлено!' : 'Ошибка'))
            .catch(error => console.log('Ошибка:', error));
        }
    </script>
</body>
</html>
