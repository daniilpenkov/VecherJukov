<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш вечер 💕</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #111; 
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        .bg-blur {
            position: fixed;
            top: -20px; left: -20px; right: -20px; bottom: -20px; 
            background-image: url('https://sun9-77.vkuserphoto.ru/s/v1/ig2/PaEN9WzLrsDIZ3B3U7vu4oIEZU5cTTZUPoxfqiZVUN71H44_6Rbar6l6LP37BD3YR5i59ofjnLduPKz03nNYgMnZ.jpg?quality=95&as=32x57,48x85,72x128,108x192,160x284,240x427,360x640,480x853,540x960,640x1138,720x1280,1080x1920&from=bu&u=-L2g89e4tqKHpfnizaKh_7gEyOqMxTcbURyr5NMnMo8&cs=1080x0');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.4); 
            z-index: -1;
        }

        .bg-clear {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://sun9-77.vkuserphoto.ru/s/v1/ig2/PaEN9WzLrsDIZ3B3U7vu4oIEZU5cTTZUPoxfqiZVUN71H44_6Rbar6l6LP37BD3YR5i59ofjnLduPKz03nNYgMnZ.jpg?quality=95&as=32x57,48x85,72x128,108x192,160x284,240x427,360x640,480x853,540x960,640x1138,720x1280,1080x1920&from=bu&u=-L2g89e4tqKHpfnizaKh_7gEyOqMxTcbURyr5NMnMo8&cs=1080x0');
            background-size: contain; 
            background-position: center; 
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* Сделали основной контейнер полупрозрачным */
        .container {
            max-width: 850px; 
            width: 100%;
            background: rgba(15, 15, 20, 0.5); /* Было 0.85, стало 0.5 */
            backdrop-filter: blur(12px); /* Добавили размытие для контейнера */
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
        }
        
        .header-wrap {
            transition: opacity 0.3s ease;
        }
        .header-wrap.hidden {
            display: none;
        }

        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        
        .subtitle { 
            text-align: center; 
            color: #ddd; 
            margin-bottom: 30px; 
            font-size: 1.15rem; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
        }
        
        .step { display: none; animation: fadeIn 0.4s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { 
            font-size: 1.4rem; 
            margin-bottom: 5px; 
            text-align: center; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8); 
        }

        .step-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 20px;
            font-style: italic;
        }
        
        .options { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 15px; 
        }
        
        /* Карточки теперь как матовое стекло */
        .option-card {
            background: rgba(255,255,255,0.05); /* Почти прозрачный фон */
            backdrop-filter: blur(8px); /* Размытие сквозь карточку */
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column; 
            overflow: hidden;
            text-align: left;
            width: 100%;
            padding: 0;
        }
        .option-card:hover {
            background: rgba(255,255,255,0.15);
            border-color: #e94560;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        
        /* Уменьшили высоту картинок, чтобы контейнер стал компактнее */
        .option-card img {
            width: 100%;
            height: 140px; /* Было 160px */
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: #333; 
        }
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.4;
        }

        .final-msg { 
            text-align: center; 
            font-size: 1.5rem; 
            line-height: 1.6; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8); 
            padding: 20px 0;
        }
        .final-msg p:last-child {
            font-size: 1.2rem; 
            color: #ddd;
            margin-top: 15px;
        }
        
        .heart { font-size: 4rem; display: block; margin-bottom: 20px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div class="bg-blur"></div>
    <div class="bg-clear"></div>

    <div class="container">
        <div class="header-wrap" id="main-header">
            <h1>Привет, солнышко 💖</h1>
            <p class="subtitle">Давай спланируем вечер двух влюбленных друг в друга жуков 🐞💞🐞</p>
        </div>

        <!-- Шаг 1: Фильм -->
        <div class="step active" id="step1">
            <h2>🎬 Что посмотрим?</h2>
            <div class="step-subtitle">(всё новенькое, рейтинги не подводят)</div>
            <div class="options">
                
                <button class="option-card" onclick="choose('film', 'Афера доктора Нока')">
                    <img src="https://static.okko.tv/images/v4/7fdc6bc9-92d0-4d78-82d4-5a04e9ba1f82" alt="Афера доктора Нока">
                    <div class="card-content">
                        <div class="card-title">🩺 Афера доктора Нока</div>
                        <div class="card-desc">Мошенник притворяется врачом и обманывает горожан. Трагикомедия</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Колония')">
                    <img src="https://i.playground.ru/e/eBS9PsZ_wXqr9sQX96cO5A.jpeg" alt="Колония">
                    <div class="card-content">
                        <div class="card-title">🧟 Колония</div>
                        <div class="card-desc">Вирус, зомби, выживание. Триллер</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Вечность')">
                    <img src="https://static.okko.tv/images/v4/10771bd4-0736-4e73-a7eb-bab6631692f2" alt="Вечность">
                    <div class="card-content">
                        <div class="card-title">💔 Вечность</div>
                        <div class="card-desc">Женщина, которая после смерти выбирает между любовью юности и годами, прожитыми с мужем. Мелодрама, комедия</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Выход 8')">
                    <img src="https://skillbox.ru/upload/setka_images/14013125082025_99ebd9c11408b0b6bb4e5268c43ec31c81eee3a2.jpg" alt="Выход 8">
                    <div class="card-content">
                        <div class="card-title">🚇 Выход 8</div>
                        <div class="card-desc">Поиск аномалий в бесконечном коридоре метро с целью выбраться. Ужасы, драма</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('film', 'Злое')">
                    <img src="https://static.okko.tv/images/v4/7a0847c7-fe02-443f-ab8f-a983ed45ae1f?presetId=4000&width=1200&height=630&scale=1&quality=80" alt="Злое">
                    <div class="card-content">
                        <div class="card-title">👁️ Злое</div>
                        <div class="card-desc">Жертва насилия видит в кошмарах убийства и пытается их предотвратить. Ужасы, детектив</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Шаг 2: Закуски -->
        <div class="step" id="step2">
            <h2>🍿 Чем похрустим?</h2>
            <div class="options">
                
                <button class="option-card" onclick="choose('snack', 'Пицца и приколы из ДоДо')">
                    <img src="https://i.pinimg.com/736x/c5/5a/dd/c55add088fb14e28ae4b36b7d94521e0.jpg" alt="Пицца и приколы из ДоДо">
                    <div class="card-content">
                        <div class="card-title">🍕 Пицца и приколы из ДоДо</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('snack', 'Роллы и приколы')">
                    <img src="https://fish-ka.su/wp-content/uploads/2018/11/42-Set-Klassicheskij-1024x683.png" alt="Роллы и приколы">
                    <div class="card-content">
                        <div class="card-title">🍣 Роллы и приколы</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('snack', 'Шаурма и рыбка на углях')">
                    <img src="https://static.tildacdn.com/stor3261-3039-4430-b530-393465626465/43951147.png" alt="Шаурма и рыбка на углях">
                    <div class="card-content">
                        <div class="card-title">🌯 Шаурма и рыбка на углях</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('snack', 'Мак')">
                    <img src="https://scdn.chibbis.ru/live/banners/5df558b9df76fde2991b67cd93ef9ce5.png" alt="Мак">
                    <div class="card-content">
                        <div class="card-title">🍔 Мак</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('snack', 'Тортик')">
                    <img src="https://irecommend.ru/sites/default/files/imagecache/copyright1/user-images/3136352/ExQX01OHbTxSwTtMxlwLQ.jpg" alt="Тортик">
                    <div class="card-content">
                        <div class="card-title">🍰 Тортик</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Шаг 3: Напитки -->
        <div class="step" id="step3">
            <h2>🥤 Что попьём?</h2>
            <div class="options">
                
                <button class="option-card" onclick="choose('drink', 'Пивко')">
                    <img src="https://i.pinimg.com/originals/f9/39/24/f93924205fa02e3af33607d2057e3417.jpg" alt="Пивко">
                    <div class="card-content">
                        <div class="card-title">🍺 Пивко</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Белое винцо')">
                    <img src="https://avatars.mds.yandex.net/get-mpic/3721790/img_id4419506163564133040.jpeg/orig" alt="Белое винцо">
                    <div class="card-content">
                        <div class="card-title">🍷 Белое винцо</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Виски-кола')">
                    <img src="https://koktajl.tv/nfiles/image/WHISKY/whiskyzcola.jpg" alt="Виски-кола">
                    <div class="card-content">
                        <div class="card-title">🥃 Виски-кола</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Чай с малиной')">
                    <img src="https://static.tildacdn.com/tild6462-3230-4863-a163-633866663064/_.jpg" alt="Чай с малиной">
                    <div class="card-content">
                        <div class="card-title">🍵 Чай с малиной</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Калимочо')">
                    <img src="https://www.discoverspain.today/wp-content/uploads/2025/05/kalimotxo-red-wine-coke-wide.jpg" alt="Калимочо">
                    <div class="card-content">
                        <div class="card-title">🍹 Калимочо</div>
                    </div>
                </button>

                <button class="option-card" onclick="choose('drink', 'Молочный коктейль')">
                    <img src="https://vsegdavkusno.ru/assets/images/recipes/1582/image_1130/1.jpg" alt="Молочный коктейль">
                    <div class="card-content">
                        <div class="card-title">🥛 Молочный коктейль</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Финал -->
        <div class="step" id="step4">
            <div class="final-msg">
                <span class="heart">💖</span>
                <p>Спасибо, любимая!</p>
                <p>Я подготовлю всё для нашего вечера. Целую 😘</p>
            </div>
        </div>
    </div>

    <script>
        const answers = {};
        let currentStep = 1;

        function choose(category, value) {
            answers[category] = value;
            
            document.getElementById('step' + currentStep).classList.remove('active');
            currentStep++;
            document.getElementById('step' + currentStep).classList.add('active');

            if (currentStep > 1) {
                document.getElementById('main-header').classList.add('hidden');
            }

            if (currentStep === 4) {
                sendData();
            }
        }

        function sendData() {
            const formspreeUrl = 'https://formspree.io/f/xaeowdvx'; 
            const text = `🎬 Фильм: ${answers.film}\n🍿 Закуски: ${answers.snack}\n🥤 Напитки: ${answers.drink}`;

            fetch(formspreeUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ "Выбор для вечера": text })
            })
            .then(response => console.log(response.ok ? 'Успешно отправлено!' : 'Ошибка'))
            .catch(error => console.log('Ошибка:', error));
        }
    </script>
</body>
</html>
